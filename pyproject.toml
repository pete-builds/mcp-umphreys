[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-umphreys"
version = "0.2.1"
description = "MCP server for Umphrey's McGee setlist data (umphreys-vault Postgres + live ATU fallthrough)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Pete Stergion" }]
keywords = ["mcp", "umphreys", "umphreys-mcgee", "atu", "fastmcp", "homelab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastmcp==3.4.7",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
    "python-dotenv==1.2.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "aiosqlite==0.22.1",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # 0.16.0 narrowed S310 so it no longer fires on a urlopen whose URL is an
    # f-string with a literal http:// scheme. Staying on 0.15.15 means the
    # suppression healthcheck.py needs to satisfy 0.15.15 is reported as an
    # unused directive (RUF100) by any newer ruff, so the two versions cannot
    # both be satisfied by one source file.
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[project.scripts]
mcp-umphreys = "mcp_umphreys.server:main"
mcp-umphreys-healthcheck = "mcp_umphreys.healthcheck:main"

[project.urls]
Homepage = "https://github.com/pete-builds/mcp-umphreys"
Repository = "https://github.com/pete-builds/mcp-umphreys"
Issues = "https://github.com/pete-builds/mcp-umphreys/issues"
Changelog = "https://github.com/pete-builds/mcp-umphreys/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_umphreys = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=mcp_umphreys",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Lives here, not in ci.yml, so a local `pytest` enforces the same gate CI
    # does. When the gate was CI-only, main could sit below it for weeks
    # without anyone running into it locally.
    "--cov-fail-under=80",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["mcp_umphreys"]
# Both are I/O adapters the suite deliberately never executes: per
# tests/fixtures/README.md the vault path is exercised through FakeVaultReader
# and the live ATU path through StubATUClient, so the suite runs with no
# Postgres and no network. Measuring them here made the gate report on code no
# test is meant to reach, which is why the 80% threshold failed on main for
# weeks while the tested surface sat near 88%. Their contracts are covered by
# the fakes in tests/test_tools.py; the SQL and HTTP bodies themselves need a
# live dependency to mean anything.
omit = [
    "*/mcp_umphreys/vault.py",
    "*/mcp_umphreys/clients/atu.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101", # asserts are fine in this codebase (used as type narrowers)
    "S104", # binding 0.0.0.0 is intentional for the container
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]  # hardcoded test passphrases are fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
mypy_path = ["src"]
files = ["src/mcp_umphreys"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*", "aiosqlite", "aiosqlite.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
