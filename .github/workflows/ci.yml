name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/mcp_umphreys

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # No coverage flags here on purpose: they live in pyproject.toml so that
        # a local `pytest` and this job enforce exactly the same gate.
        run: pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-umphreys:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image ships the Python minor version we target
        # Guard rail for the digest-bump trap. Every other job in this workflow
        # runs on actions/setup-python 3.13, so nothing here ever executes the
        # *image's* interpreter. That let a Dependabot digest bump move the
        # Dockerfile FROM tag from 3.13 to 3.14 and ship a runtime no lockfile
        # or check had exercised, with CI fully green throughout.
        #
        # requirements.lock is compiled with --python-version 3.13 and
        # pyproject targets py313, so the image must agree. --entrypoint is
        # required: the image's ENTRYPOINT is the server itself.
        run: |
          docker run --rm --entrypoint python mcp-umphreys:ci -c '
          import sys
          want = (3, 13)
          got = sys.version_info[:2]
          assert got == want, (
              f"image ships Python {sys.version.split()[0]}, but pyproject, "
              f"the CI matrix and requirements.lock all target "
              f"{want[0]}.{want[1]}. Fix the Dockerfile FROM tag, or retarget "
              f"every version surface together."
          )
          print(f"image Python {sys.version.split()[0]} matches target {want[0]}.{want[1]}")
          '
